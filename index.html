<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HE Ajanda</title>
<meta name="apple-mobile-web-app-title" content="HE Ajanda">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#CD1E25">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column, brand bar on top, Gün/Ay switch, quick-add always first, list below. */
:root{
  --bg:#F5F4F2; --surface:#FFFFFF; --ink:#100F0D; --muted:#6B6863; --line:#E4E1DC; --soft:#EEECE8;
  --brand:#CD1E25; --brand-ink:#FFFFFF; --brand-soft:#FBE9EA; --ok:#1E7A4F;
  --font-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1B1A18; --ink:#F2F0EC; --muted:#A09C95; --line:#2D2B28; --soft:#24221F;
  --brand:#E0353B; --brand-ink:#FFFFFF; --brand-soft:#3A1C1D; --ok:#4DB885; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1B1A18; --ink:#F2F0EC; --muted:#A09C95; --line:#2D2B28; --soft:#24221F;
  --brand:#E0353B; --brand-ink:#FFFFFF; --brand-soft:#3A1C1D; --ok:#4DB885; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 96px}

/* Brand bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-row{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{display:block;height:26px;color:var(--ink);flex:none}
.brand-mark svg{height:100%;width:auto;display:block}
.brand-sep{width:1px;height:20px;background:var(--line)}
.brand-name{font-family:var(--font-display);font-weight:500;font-size:15px;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.tabs{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.tab{padding:6px 16px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

/* Period header */
.period{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:22px}
.period h1{font-family:var(--font-display);font-weight:500;font-size:clamp(26px,6vw,34px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.period .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:4px}
.nav{display:flex;gap:4px;align-items:center;flex:none}
.icon-btn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.today-btn{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.today-btn:hover{border-color:var(--ink)}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:var(--r);background:transparent;border:1px solid transparent}
.day:hover{background:var(--surface)}
.day .dn{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dd{font-family:var(--font-display);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.day .dots{height:5px;display:flex;gap:3px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.55}
.day .dots i.done{background:var(--ok);opacity:1}
.day.is-today .dd{color:var(--brand)}
.day[aria-current="date"]{background:var(--surface);border-color:var(--line)}
.day[aria-current="date"] .dd{font-weight:600}

/* Quick add */
.add{margin-top:18px;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px;transition:border-color .15s}
.add:focus-within{border-color:var(--ink)}
.add input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:8px 0;outline:none}
.add input::placeholder{color:var(--muted)}
.flag-toggle{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.flag-toggle:hover{background:var(--soft)}
.flag-toggle[aria-pressed="true"]{color:var(--brand);background:var(--brand-soft)}
.flag-toggle svg{width:18px;height:18px}
.add-btn{height:38px;padding:0 16px;border-radius:9px;background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.add-btn:hover{filter:brightness(1.06)}
.add-btn svg{width:16px;height:16px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 2px 0}

/* Progress */
.progress{display:flex;align-items:center;gap:12px;margin-top:22px}
.progress .bar{flex:1;height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .3s}
.progress .lbl{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress .lbl b{color:var(--ink);font-weight:700}

/* Sections & tasks */
.section{margin-top:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 8px}
.section-head h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.link-btn{font-size:13px;font-weight:600;color:var(--brand)}
.link-btn:hover{text-decoration:underline}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 10px 12px 14px;border-top:1px solid var(--line);position:relative}
.task:first-child{border-top:0}
.task.important::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.check{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:1.6px solid var(--muted);display:grid;place-items:center;color:transparent;transition:all .15s}
.check:hover{border-color:var(--ink)}
.check svg{width:13px;height:13px}
.task.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.task-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.task-text{overflow-wrap:anywhere;cursor:text;padding-top:1px}
.task.done .task-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.task-meta{font-size:12px;color:var(--muted)}
.task-edit{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:3px 7px;outline:none}
.task-edit:focus{border-color:var(--ink)}
.acts{display:flex;gap:2px;flex:none;opacity:.55;transition:opacity .15s}
.task:hover .acts,.task:focus-within .acts{opacity:1}
.act{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.act:hover{background:var(--soft);color:var(--ink)}
.act.on{color:var(--brand);opacity:1}
.act svg{width:16px;height:16px}
.act.del:hover{color:var(--brand)}
@media (hover:none){.acts{opacity:1}}

.carry .list{border-style:dashed;background:transparent}
.carry .task-meta{color:var(--brand)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--ink);font-family:var(--font-display);font-weight:500;font-size:17px;margin-bottom:2px}

details.done-group summary{list-style:none;cursor:pointer}
details.done-group summary::-webkit-details-marker{display:none}
details.done-group summary h2::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.done-group[open] summary h2::before{transform:rotate(90deg)}

/* Month calendar */
.cal{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 6px}
.cal-cell{min-height:50px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-size:14px}
.cal-cell:hover{background:var(--soft)}
.cal-cell.out{visibility:hidden}
.cal-cell.is-today{color:var(--brand);font-weight:700}
.cal-cell .cnt{font-size:10.5px;color:var(--muted);line-height:1;min-height:11px}
.cal-cell .cnt.all{color:var(--ok);font-weight:700}
.cal-cell.has{background:var(--soft)}

.status{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}
.status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.status.synced .dot{background:var(--ok)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;font-size:14px;box-shadow:0 8px 24px rgb(0 0 0 / .2);transition:all .2s;max-width:calc(100% - 32px);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{font-weight:700;color:var(--bg);text-decoration:underline;padding:4px}

/* Smart input preview */
.parse{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 2px 0;min-height:24px;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:12px}
.chip.where{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.imp{color:var(--brand);border-color:var(--brand)}
.ex{color:var(--muted)}
.ex code{white-space:nowrap;font-family:inherit;font-weight:600;color:var(--ink);background:var(--soft);padding:1px 6px;border-radius:5px;cursor:pointer}
.ex code:hover{background:var(--line)}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;color:var(--ink);background:var(--soft);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.task.done .time{color:var(--muted)}

/* Tools row */
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tool{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600}
.tool:hover{border-color:var(--ink)}
.tool svg{width:15px;height:15px;color:var(--brand)}
.tool[disabled]{opacity:.5;cursor:default}

/* Brain dump */
.dump{margin-top:14px;background:var(--surface);border:1px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dump h3{margin:0;font-family:var(--font-display);font-weight:500;font-size:18px}
.dump p{margin:0;color:var(--muted);font-size:13.5px}
.dump textarea{width:100%;min-height:120px;resize:vertical;font:inherit;font-size:15px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.dump textarea:focus{border-color:var(--ink)}
.dump-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.btn{height:38px;padding:0 16px;border-radius:9px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.dump-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dump-list li{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.dump-list li:first-child{border-top:0}
.dump-list input[type=checkbox]{margin-top:3px;accent-color:var(--brand);width:16px;height:16px;flex:none}
.dump-list label{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.dump-list .chips{display:flex;flex-wrap:wrap;gap:5px}
.thinking{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:8px}
.thinking::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}

/* Focus suggestion */
.focus{margin-top:16px;border-radius:12px;padding:12px 14px;background:var(--brand-soft);display:flex;gap:10px;align-items:flex-start}
.focus svg{width:18px;height:18px;color:var(--brand);flex:none;margin-top:2px}
.focus .ft{flex:1;min-width:0;font-size:14px}
.focus .ft b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:2px}
.task.first .task-text{font-weight:700}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink);background:var(--brand);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:2px}

@media (max-width:520px){
  .brand-sep,.brand-name{display:none}
  .tab{padding:6px 12px}
  .add-btn span{display:none}
  .add-btn{padding:0 11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v3 ===== */
.top-row .tabs{display:inline-flex}
.task-body{cursor:pointer}
.task-text{cursor:pointer}
.task-desc{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.mini{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:5px;padding:1px 7px;font-variant-numeric:tabular-nums}
.mini svg{width:11px;height:11px}
.mini.cd{color:var(--brand);background:var(--brand-soft)}
.mini.all{color:var(--ok)}
.task.note-item .task-text{font-style:normal}
.summary{font-size:13.5px;color:var(--muted);margin-top:6px}
.summary b{color:var(--ink);font-weight:700}

/* Countdown corner */
#cd{max-width:720px;margin:12px auto 0;padding-inline:16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#cd::-webkit-scrollbar{display:none}
#cd:empty{display:none}
.cd-card{flex:none;min-width:180px;max-width:240px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px 10px 12px;position:relative;overflow:hidden}
.cd-card::after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--brand)}
.cd-num{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:var(--bg)}
.cd-num.today{font-size:18px;color:#FF5A60}
.cd-txt{min-width:0;display:flex;flex-direction:column;gap:1px}
.cd-lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.cd-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-date{font-size:11.5px;opacity:.65}
@media (min-width:1540px){
  #cd{position:fixed;right:24px;top:calc(env(safe-area-inset-top,0px) + 86px);width:230px;margin:0;padding:0;flex-direction:column;overflow:visible;z-index:4}
  .cd-card{max-width:none;width:100%}
  #cd::before{content:"Geri sayım";font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-left:2px}
}

/* Sheet (task detail) */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .32);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:31;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;transition:transform .25s ease;box-shadow:0 10px 40px rgb(0 0 0 / .25)}
@media (min-width:721px){.sheet{top:0;right:0;bottom:0;width:440px;max-width:100%;transform:translateX(105%);border-left:1px solid var(--line)}.sheet.show{transform:none}}
@media (max-width:720px){.sheet{left:0;right:0;bottom:0;max-height:92%;border-radius:18px 18px 0 0;transform:translateY(105%)}.sheet.show{transform:none}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
@media (max-width:720px){.sheet-head{padding-top:12px}}
.sheet-head .grow{flex:1}
.sheet-body{overflow-y:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:18px}
.sheet-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.sh-title{width:100%;border:0;background:transparent;font-family:var(--font-display);font-size:22px;font-weight:500;color:var(--ink);resize:none;outline:none;padding:0;line-height:1.25;overflow:hidden}
.sh-title:focus{box-shadow:0 2px 0 var(--line)}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px;align-self:flex-start}
.seg button{padding:6px 14px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.inp{font:inherit;font-size:15px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;min-width:0}
.inp:focus{border-color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
.quick button:hover{border-color:var(--ink)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tgl{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.tgl svg{width:16px;height:16px}
.tgl[aria-pressed="true"]{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
.tgl.done[aria-pressed="true"]{color:var(--ok);border-color:var(--ok);background:transparent}
.sh-desc{width:100%;min-height:110px;resize:none;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;overflow:hidden}
.sh-desc:focus{border-color:var(--ink)}
.subs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sub{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.sub .check{width:20px;height:20px}
.sub.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.sub input.sub-text{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none;padding:4px 0}
.sub.done input.sub-text{color:var(--muted);text-decoration:line-through}
.sub .act{width:28px;height:28px}
.sub-add{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--muted)}
.sub-add svg{width:16px;height:16px;flex:none;margin-left:2px}
.sub-add input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none;padding:4px 0}
.del-btn{color:var(--brand);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.del-btn svg{width:15px;height:15px}

/* Notes */
.notes{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;margin-top:22px;align-items:start}
.note-list{display:flex;flex-direction:column;gap:6px}
.note-new{display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:14px}
.note-new svg{width:16px;height:16px}
.note-card{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid transparent;display:flex;flex-direction:column;gap:2px;min-width:0}
.note-card:hover{background:var(--surface)}
.note-card[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.note-card .nt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-card .nm{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.note-title{border:0;background:transparent;font-family:var(--font-display);font-size:24px;font-weight:500;color:var(--ink);outline:none;padding:0;width:100%}
.note-body{width:100%;min-height:46vh;resize:none;border:0;background:transparent;font:inherit;font-size:16px;line-height:1.65;color:var(--ink);outline:none;padding:0;overflow:hidden}
.note-body::placeholder,.note-title::placeholder{color:var(--muted)}
.note-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.detected{margin-top:14px}
.detected .list .task{cursor:pointer}
.det-date{flex:none;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--bg);background:var(--ink);border-radius:6px;padding:3px 8px;margin-top:1px;white-space:nowrap}
.back-btn{display:none;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--muted);margin-top:16px}
.back-btn svg{width:16px;height:16px}

/* Bottom nav on phones */
.bnav{display:none}
@media (max-width:640px){
  .top-row .tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11.5px;font-weight:600;color:var(--muted)}
  .bnav button svg{width:21px;height:21px}
  .bnav button[aria-selected="true"]{color:var(--brand)}
  .wrap{padding-block:0 120px}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .brand-sep,.brand-name{display:inline-block}
  .notes{grid-template-columns:1fr}
  .notes.editing .note-list{display:none}
  .notes:not(.editing) .editor-col{display:none}
  .back-btn{display:inline-flex}
}

/* ===== v4: notlar merkezli ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left}
.stat:hover{border-color:var(--ink)}
.stat b{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.stat:nth-child(2) b{color:var(--brand)}
.search{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--soft);border-radius:11px;padding:0 12px;color:var(--muted)}
.search svg{width:17px;height:17px;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:10px 0;outline:none}
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.note-grid .note-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;gap:4px;min-height:96px}
.note-grid .note-card:hover{border-color:var(--ink)}
.note-card .ns{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-card .nm{margin-top:auto}
.period .add-btn{flex:none}
.back-btn{display:inline-flex!important;margin-top:18px}
.editor{margin-top:10px}
.note-meta{font-size:12px;color:var(--muted);text-align:center}
.note-body{min-height:50vh}
.hint{font-size:13px;color:var(--muted);margin:12px 2px 0}
.hint b{color:var(--ink)}
.cal{margin-top:16px}
.cal-cell[aria-current="date"]{background:var(--ink)!important;color:var(--bg)!important}
.cal-cell[aria-current="date"] .cnt{color:var(--bg);opacity:.8}
.cal-cell.fair{box-shadow:inset 0 -3px 0 var(--brand)}
.day-title{font-family:var(--font-display);font-size:19px!important;font-weight:500!important;letter-spacing:0!important;text-transform:none!important;color:var(--ink)!important}
.day-panel .add{margin-top:10px}
.parse:empty{min-height:0;margin:0}
.note-row{align-items:flex-start}
.note-row .det-date.nd{min-width:64px;text-align:center}
.note-row .det-date svg{width:13px;height:13px;vertical-align:-2px}
.note-row .task-text b{font-weight:700}
@media (max-width:640px){
  .bnav{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .note-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:380px){.note-grid{grid-template-columns:1fr}}

/* ===== v5: Apple Notlar tarzı ===== */
.nwrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;margin-top:20px;align-items:start}
.nside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 100px);min-width:0}
.nside-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nside-head h1{font-family:var(--font-display);font-weight:500;font-size:28px;margin:0}
.nside .search{margin-top:0}
.nlist{display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0}
.np{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:10px;min-width:0}
.np:hover{background:var(--surface)}
.np.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--brand)}
.np-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-s b{color:var(--ink);font-weight:700}
.np-s b.late{color:var(--muted);text-decoration:line-through}
.np-s b.fair{color:var(--brand)}
.np[data-note-open="draft"] .np-t{color:var(--brand)}
.nmain{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 22px 22px;min-width:0}
.ntop{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.ntop .back-btn{margin:0;visibility:hidden}
.ntools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px;margin:4px -8px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.ntool{min-width:38px;height:36px;padding:0 9px;border-radius:9px;display:inline-grid;place-items:center;color:var(--ink);font-size:14px}
.ntool:hover,.ntool.on{background:var(--soft)}
.ntool svg{width:19px;height:19px}
.ntool.sm{font-size:12.5px;font-weight:600;border:1px solid var(--line);height:32px}
.ttools{display:inline-flex;gap:4px;margin-left:auto}
.ttools[hidden]{display:none!important}
.ned{min-height:55vh;outline:none;font-size:17px;line-height:1.6;overflow-wrap:anywhere}
.ned{position:relative}
.ned.is-empty::before{content:attr(data-ph);color:var(--muted);position:absolute;left:0;top:0;pointer-events:none;font-size:17px;font-weight:400;font-family:var(--font-body)}
.ned>div:first-child,.ned>h2:first-child{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.25;margin-bottom:6px}
.ned h2{font-family:var(--font-display);font-size:22px;font-weight:600;margin:14px 0 4px;line-height:1.3}
.ned ul,.ned ol{margin:4px 0;padding-left:26px}
.ned ul.checklist{list-style:none;padding-left:0}
.ned ul.checklist>li{position:relative;padding-left:32px;min-height:1.6em}
.ned ul.checklist>li::before{content:"";position:absolute;left:2px;top:.25em;width:19px;height:19px;border-radius:50%;border:1.6px solid var(--muted);cursor:pointer}
.ned ul.checklist>li[data-done="1"]{color:var(--muted);text-decoration:line-through}
.ned ul.checklist>li[data-done="1"]::before{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 3px var(--surface)}
.ned table{border-collapse:collapse;margin:10px 0;width:100%;font-size:15px;display:block;overflow-x:auto}
.ned td,.ned th{border:1px solid var(--line);padding:7px 10px;min-width:90px;vertical-align:top}
.ned tr:first-child td{font-weight:700;background:var(--soft)}
.ned figure.sketch{margin:10px 0;border:1px dashed var(--line);border-radius:12px;padding:6px;cursor:pointer;color:var(--ink);background:var(--surface)}
.ned figure.sketch:hover{border-color:var(--ink)}
.ned figure.sketch svg{display:block;width:100%;height:auto}
.nmain .detected{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
/* çizim alanı */
.draw-ov{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .45);display:flex;align-items:center;justify-content:center;padding:16px}
.draw-box{background:var(--surface);color:var(--ink);border-radius:16px;width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgb(0 0 0 / .35)}
.draw-bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.draw-grp{display:flex;gap:6px;align-items:center}
.dot-btn{width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.dot-btn.on{box-shadow:0 0 0 2px var(--ink)}
.size-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.size-btn i{display:block;border-radius:50%;background:var(--ink)}
.size-btn.on{background:var(--soft)}
.draw-pad{padding:12px;overflow:auto;background:var(--bg)}
.draw-pad canvas{display:block;background:var(--surface);border-radius:10px;touch-action:none;cursor:crosshair;box-shadow:0 0 0 1px var(--line)}
.draw-foot{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.draw-foot .grow{flex:1}
@media (max-width:640px){
  .nwrap{grid-template-columns:1fr;margin-top:12px}
  .nwrap:not(.list-open) .nside{display:none}
  .nwrap.list-open .nmain{display:none}
  .nside{position:static;max-height:none}
  .ntop .back-btn{visibility:visible}
  .nmain{border:0;background:transparent;padding:0 0 10px;border-radius:0}
  .ntools{margin:4px 0 10px;background:var(--bg);top:calc(env(safe-area-inset-top,0px) + 58px)}
  .ned{font-size:17px}
}
.wrap.wide{max-width:1000px}
.wrap.wide~#cd,#cd{max-width:1000px}

/* ===== v6: Fuar Panosu ===== */
.season{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;overflow-x:auto}
.season-m,.season-t{display:grid;grid-template-columns:repeat(12,minmax(54px,1fr));min-width:660px}
.season-m span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px 6px}
.season-t{position:relative;height:calc(var(--rows)*30px + 12px)}
.season-t i{border-left:1px solid var(--line)}
.season-now{position:absolute;top:0;bottom:0;width:2px;background:var(--brand);border-radius:2px}
.season-bar{position:absolute;height:24px;min-width:84px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:700;padding:0 7px;text-align:left;overflow:hidden;white-space:nowrap}
.season-bar span{display:block;overflow:hidden;text-overflow:ellipsis}
.season-bar.late{background:var(--brand);color:#fff}
.season-bar.live{background:var(--ok);color:#fff}
.season-bar.past{opacity:.45}
.fcards{display:flex;flex-direction:column;gap:12px}
.fcard{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;position:relative;overflow:hidden}
.fcard:hover{border-color:var(--ink)}
.fcard.late{box-shadow:inset 4px 0 0 var(--brand)}
.fcard.live{box-shadow:inset 4px 0 0 var(--ok)}
.fcard.past{opacity:.7}
.fc-left{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 4px}
.fc-num{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.fc-lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-top:4px}
.fc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.fc-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fc-head h3{margin:0;font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.fc-sub{margin:0;font-size:13.5px;color:var(--muted)}
.pill{flex:none;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--muted)}
.pill.late{background:var(--brand-soft);color:var(--brand)}
.pill.live{background:var(--ok);color:#fff}
.pill.ok{color:var(--ok)}
.stages{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.stg{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:7px 6px 6px;border-radius:8px;background:var(--soft);text-align:left;min-width:0;border:1px solid transparent}
.stg i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;color:#fff}
.stg i svg{width:10px;height:10px}
.stg span{font-size:11.5px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.stg em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.stg.done{opacity:.6}
.stg.done i{background:var(--ok);border-color:var(--ok)}
.stg.late{background:var(--brand-soft)}
.stg.late em{color:var(--brand);font-weight:700}
.stg.next{border-color:var(--ink);background:var(--surface)}
.fc-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.fc-foot .bar{flex:1;min-width:80px;height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.fc-foot .bar i{display:block;height:100%;background:var(--ok)}
.fc-next b{color:var(--ink)}
.fc-chk{display:inline-flex;align-items:center;gap:4px}.fc-chk svg{width:13px;height:13px}
.fs-hint{font-size:12px;color:var(--muted)}
#fsCheckNew{margin-top:8px}
.sub .act.del{flex:none;color:var(--muted)}
.mini-l{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.sub .inp[type=date]{flex:none}
.cal-cell.fair{box-shadow:inset 0 -3px 0 var(--brand)}
@media (max-width:640px){
  .bnav{grid-template-columns:repeat(3,1fr)!important}
  .stages{grid-template-columns:repeat(4,minmax(0,1fr))}
  .fcard{flex-direction:column;gap:12px;padding:14px}
  .fc-left{width:auto;flex-direction:row;gap:8px;justify-content:flex-start;padding:8px 12px;align-self:flex-start}
  .fc-lbl{margin:0}
}
</style>
</head>

const FIX_ROOTS=[["hazirlik","hazırlık"],["hazirla","hazırla"],["ugra","uğra"],["gonder","gönder"],["dosya","dosya"],["fatura","fatura"],["stand","stand"],["fiyat","fiyat"],["baski","baskı"],["cikti","çıktı"],["ucak","uçak"],["kira","kira"],["banka","banka"],["fuar","fuar"],["musteri","müşteri"],["toplanti","toplantı"],["gorusme","görüşme"],["odeme","ödeme"],["siparis","sipariş"],["tedarikci","tedarikçi"],["sozlesme","sözleşme"],["butce","bütçe"],["tasarim","tasarım"],["urun","ürün"],["ziyaretci","ziyaretçi"],["katilimci","katılımcı"],["arastirma","araştırma"],["hatirlatma","hatırlatma"],["carsamba","çarşamba"],["persembe","perşembe"],["agustos","ağustos"],["kasim","kasım"],["aralik","aralık"],["subat","şubat"],["mayis","mayıs"],["eylul","eylül"],["yarin","yarın"],["bugun","bugün"],["alisveris","alışveriş"],["iletisim","iletişim"],["konaklama","konaklama"],["kurulum","kurulum"],["fuar","fuar"],["istanbul","İstanbul"],["izmir","İzmir"],["ankara","Ankara"]];
function fixWord(w){
  const lower=w.toLocaleLowerCase("tr-TR"); let out=FIX_WORDS[lower];
  if(!out&&/^[a-z]+$/.test(lower)){
    for(const[r,t] of FIX_ROOTS){ if(lower.length>r.length&&lower.startsWith(r)){
      let suf=lower.slice(r.length); const lastV=(t.match(/[aeıioöuü](?=[^aeıioöuü]*$)/)||[""])[0];
      if("aıou".includes(lastV)) suf=suf.replace(/i/g,"ı"); else if("öü".includes(lastV)) suf=suf.replace(/u/g,"ü");
      out=t+suf; break; } }
  }
  if(!out) return w;
  if(w===w.toLocaleUpperCase("tr-TR")&&w.length>1) return out.toLocaleUpperCase("tr-TR");
  if(w[0]!==w[0].toLocaleLowerCase("tr-TR")) return out.charAt(0).toLocaleUpperCase("tr-TR")+out.slice(1);
  return out;
}
function tidy(s){
  if(!s) return s;
  let t=String(s).replace(/[ \t]+/g," ").replace(/ +([,.;:!?])/g,"$1").replace(/([,;])(?=[^\s\d])/g,"$1 ").trim();
  t=t.replace(/[\p{L}]+/gu,w=>fixWord(w));
  t=t.replace(/(^|[.!?]\s+)(\p{Ll})/gu,(m,a,b)=>a+b.toLocaleUpperCase("tr-TR"));
  return t;
}
/* ---------- Türkçe akıllı yazma ---------- */
const AYLAR=["ocak","şubat","mart","nisan","mayıs","haziran","temmuz","ağustos","eylül","ekim","kasım","aralık"];
const GUNLER=[["pazartesi",1],["cumartesi",6],["çarşamba",3],["perşembe",4],["salı",2],["cuma",5],["pazar",0]];
const L="[\\p{L}\\d]", SUF="(?:['’]?\\p{L}*)";
const Ws=s=>"(?<!"+L+")(?:"+s+")"+SUF+"(?!"+L+")";
const W=s=>new RegExp(Ws(s),"iu");
function parseSmart(raw,ctx){
  // ctx: {scope, date, today:Date}
  const today=new Date(ctx.today.getFullYear(),ctx.today.getMonth(),ctx.today.getDate());
  let s=" "+raw.trim()+" ", out={scope:ctx.scope,date:ctx.date,time:null,important:false,found:[]};
  const take=(re,fn)=>{const m=s.match(re);if(!m)return false;s=s.slice(0,m.index)+" "+s.slice(m.index+m[0].length);fn(m);return true};
  const setDay=(d,label)=>{out.scope="day";out.date=ymd(d);out.found.push(label||"gün")};
  const setMonth=d=>{out.scope="month";out.date=ym(d);out.found.push("ay")};
  if(/^\s*!/.test(s)){s=s.replace(/^\s*!+\s*/," ");out.important=true}
  if(W("acil|önemli").test(s)) out.important=true;
  // saat
  take(/(?<![\p{L}\d.:/])(?:saat\s*)?([01]?\d|2[0-3]):([0-5]\d)(?![\d])(?:['’]?\p{L}*)/iu,m=>{out.time=pad(+m[1])+":"+m[2]})
   || take(/(?<![\p{L}\d])saat\s*([01]?\d|2[0-3])(?:[.]([0-5]\d))?(?![\d])(?:['’]?\p{L}*)/iu,m=>{let h=+m[1];if(!m[2]&&h>=1&&h<=7)h+=12;out.time=pad(h)+":"+(m[2]||"00")});
  // bir ara
  // gün ifadeleri
  if(take(W("yarından sonra|öbür gün|ertesi gün"),()=>setDay(addDays(today,2))));
  else if(take(W("yarın"),()=>setDay(addDays(today,1))));
  else if(take(W("bugün|bu akşam|bu sabah|bu öğlen"),()=>setDay(today)));
  else if(take(/(?<![\p{L}\d])(\d{1,2})\s*(gün|hafta)\s*sonra(?:['’]?\p{L}*)/iu,m=>setDay(addDays(today,+m[1]*(m[2].toLowerCase()==="hafta"?7:1)))));
  else if(take(new RegExp("(?<!"+L+")(\\d{1,2})\\s+("+AYLAR.join("|")+")"+SUF+"(?:\\s+(\\d{4}))?(?!"+L+")","iu"),m=>{
      const mo=AYLAR.indexOf(m[2].toLocaleLowerCase("tr-TR"));let y=m[3]?+m[3]:today.getFullYear();
      let d=new Date(y,mo,+m[1]); if(!m[3]&&d<addDays(today,-31)) d=new Date(y+1,mo,+m[1]); setDay(d)}));
  else if(take(/(?<![\p{L}\d:])(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?![\d:])/u,m=>{
      let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):today.getFullYear();const mo=+m[2]-1,dd=+m[1];
      if(mo<0||mo>11||dd<1||dd>31) return; let d=new Date(y,mo,dd); if(!m[3]&&d<addDays(today,-31)) d=new Date(y+1,mo,dd); setDay(d)}));
  else{
    const hafta=take(W("haftaya|gelecek hafta|önümüzdeki hafta"),()=>{});
    let gun=null;
    for(const [n,i] of GUNLER){ if(take(new RegExp(Ws(n)+"(?:\\s+günü"+SUF+")?","iu"),()=>{})){gun=i;break;} }
    if(gun!==null){
      if(hafta){const mon=addDays(today,7-((today.getDay()+6)%7));setDay(addDays(mon,(gun+6)%7));}
      else setDay(addDays(today,(gun-today.getDay()+7)%7));
    } else if(hafta){ setDay(addDays(today,7)); }
    else if(take(W("gelecek ay|önümüzdeki ay|seneye"),()=>{})) setMonth(addMonths(today,1));
    else if(take(W("bu ay|ay içinde|ay sonuna kadar|ay sonu|ay sonunda"),()=>{})) setMonth(today);
    else take(new RegExp("(?<!"+L+")("+AYLAR.join("|")+")"+SUF+"(?:\\s+ay"+SUF+")?(?!"+L+")","iu"),m=>{
      const mo=AYLAR.indexOf(m[1].toLocaleLowerCase("tr-TR"));let y=today.getFullYear();if(mo<today.getMonth())y++;setMonth(new Date(y,mo,1))});
  }
  if(out.time&&out.scope!=="day"){ if(out.scope==="someday"){} else {out.scope="day";out.date=ctx.scope==="day"?ctx.date:ymd(today);} }
  let text=s.replace(/\s+/g," ").replace(/^[\s,.;:–\-•*·]+|[\s,;:–\-]+$/g,"").trim();
  if(text) text=text.charAt(0).toLocaleUpperCase("tr-TR")+text.slice(1);
  out.text=text||raw.trim();

}

function whereLabel(p){
  if(p.scope==="someday"||!p.date) return "Tarihsiz";
  if(p.scope==="month") return cap(fmtMonth.format(parseYm(p.date)));
  const t=todayStr(), d=parseYmd(p.date);
  const rel=p.date===t?"Bugün":p.date===ymd(addDays(new Date(),1))?"Yarın":null;
  return (rel?rel+", ":"")+fmtShort.format(d)+" "+DN[(d.getDay()+6)%7];
}
function shortDate(p){
  if(p.scope==="month") return cap(fmtMonth.format(parseYm(p.date)).split(" ")[0]);
  const d=daysUntil(p.date);
  if(d===0) return "Bugün"; if(d===1) return "Yarın"; if(d===-1) return "Dün";
  return fmtShort.format(parseYmd(p.date));
}

/* ---------- state ---------- */
const LS_TASKS="headexpo.ajanda.tasks.v1", LS_NOTES="headexpo.ajanda.notes.v1", LS_UI="headexpo.ajanda.ui.v2";
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let tasks=new Map(), notes=new Map(), fairs=new Map();
const LS_FAIRS="headexpo.ajanda.fairs.v1";
(lsGet(LS_TASKS)||[]).forEach(t=>{if(t&&t.id)tasks.set(t.id,t)});
(lsGet(LS_NOTES)||[]).forEach(n=>{if(n&&n.id)notes.set(n.id,n)});
(lsGet(LS_FAIRS)||[]).forEach(f=>{if(f&&f.id)fairs.set(f.id,f)});

/* ---------- storage ---------- */
const queues={};
function enqueue(key,op){queues[key]=(queues[key]||Promise.resolve()).then(op).catch(onWriteError);}
function onWriteError(e){
  const code=e&&e.code;
  if(code==="invalid_argument"){readOnly=true;toast("Bu listede değişiklik yapma izniniz yok.");render();}
  else if(code==="quota_exceeded"){toast("Depolama doldu. Tamamlananları temizleyip tekrar deneyin.");}
  else toast("Kaydedilemedi. Bağlantınızı kontrol edip tekrar deneyin.");
}
function persist(colName,kind,obj){
  const store=colName==="tasks"?tasks:colName==="notes"?notes:fairs, lsKey=colName==="tasks"?LS_TASKS:colName==="notes"?LS_NOTES:LS_FAIRS;
  lsSet(lsKey,[...store.values()]);
  if(mode==="pending"){pending.push([colName,kind,obj]);return;}
  if(mode==="local") return;
  const ref=db.collection(colName).doc(obj.id);
  if(kind==="del") enqueue(colName+obj.id,()=>ref.delete());
  else{const body=Object.assign({},obj);delete body.id;enqueue(colName+obj.id,()=>ref.set(body));}
}
function put(t,quiet){tasks.set(t.id,t);persist("tasks","set",t);if(!quiet)render();}
function del(t){tasks.delete(t.id);persist("tasks","del",t);render();}
function putNote(n){notes.set(n.id,n);persist("notes","set",n);}
function delNote(n){notes.delete(n.id);persist("notes","del",n);}
function putFair(f){fairs.set(f.id,f);persist("fairs","set",f);}
function delFair(f){fairs.delete(f.id);persist("fairs","del",f);}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

async function connect(){
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){mode="local";pending=[];render();return;}
  mode="db";
  const queued=pending; pending=[];
  queued.forEach(([c,k,o])=>persist(c,k,o));
  db.collection("tasks").onSnapshot(snap=>{
    const m=new Map(); snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,Object.assign({id:d.id},v))});
    tasks=m; lsSet(LS_TASKS,[...m.values()]); render();
  },err=>{if(err&&err.code==="revoked"){readOnly=true;render();}});
  db.collection("fairs").onSnapshot(snap=>{
    const m=new Map(); snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,Object.assign({id:d.id},v))});
    fairs=m; lsSet(LS_FAIRS,[...m.values()]); if(!(sheetId&&String(sheetId).startsWith("fair:"))) render(); else {renderCountdown();}
  },()=>{});
  db.collection("notes").onSnapshot(snap=>{
    const m=new Map(); snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,Object.assign({id:d.id},v))});
    const cur=ui.noteId&&notes.get(ui.noteId);
    if(cur&&noteDirty.has(cur.id)) m.set(cur.id,cur);
    notes=m; lsSet(LS_NOTES,[...m.values()]); render();
  },()=>{});
}

const all=()=>[...tasks.values()];
const sortTasks=a=>a.sort((x,y)=>(y.important?1:0)-(x.important?1:0)||(x.time?0:1)-(y.time?0:1)||String(x.time||"").localeCompare(String(y.time||""))||(x.createdAt||0)-(y.createdAt||0));
const dayTasks=d=>all().filter(t=>t.scope==="day"&&t.date===d);
const monthTasks=m=>all().filter(t=>t.scope==="month"&&t.date===m);
const undated=()=>all().filter(t=>t.scope==="someday"||!t.date);
const overdue=()=>sortTasks(all().filter(t=>t.scope==="day"&&!t.done&&t.date<todayStr())).sort((a,b)=>a.date<b.date?-1:1);
const FAIR=/fuar|expo|fair|kongre|zirve|sergi/i;
const wantsCountdown=t=>t.countdown===true||(t.countdown===undefined&&FAIR.test(t.text||""));
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
const noteTitle=n=>tidy(firstLine(n.body))||"Yeni not";
function noteItems(n){
  const out=[], seen={};
  String(n.body||"").split("\n").forEach((line,idx)=>{
    if(!line.trim()) return;
    const p=parseSmart(tidy(line),{scope:"none",date:null,today:new Date()});
    if(!p.found.length||(p.scope!=="day"&&p.scope!=="month")) return;
    if(p.scope==="month"&&!/bu ay|gelecek ay|önümüzdeki ay|ay sonu|ay içinde|ayında|ayı içinde/i.test(tidy(line))) return;
    let k=n.id+":"+hash(line.trim().toLocaleLowerCase("tr-TR")); if(seen[k]) k+="-"+idx; seen[k]=1;
    out.push({key:k,noteId:n.id,text:p.text,scope:p.scope,date:p.date,time:p.time,important:p.important,done:!!(n.done&&n.done[k])});
  });
  return out;
}
const allNoteItems=()=>[...notes.values()].flatMap(noteItems);
// takvimdeki her şey tek listede: işler + not satırları
function itemsOn(scope,date){
  const ts=all().filter(t=>t.scope===scope&&t.date===date).map(t=>({kind:"task",t,done:!!t.done,date:t.date,time:t.time,text:t.text,important:t.important,scope}));
  const ns=allNoteItems().filter(i=>i.scope===scope&&i.date===date).map(i=>({kind:"note",i,done:i.done,date:i.date,time:i.time,text:i.text,important:i.important,scope}));
  return ts.concat(ns).concat(scope==="day"?fairItemsOn(date):[]);
}
const sortItems=a=>a.sort((x,y)=>(x.done?1:0)-(y.done?1:0)||(y.important?1:0)-(x.important?1:0)||(x.time?0:1)-(y.time?0:1)||String(x.time||"").localeCompare(String(y.time||"")));

/* ---------- actions ---------- */
function makeTask(p){return {id:newId(),text:p.text,desc:"",subs:[],scope:p.scope==="none"?"day":p.scope,date:p.date||ui.day,time:p.time||null,done:false,important:!!p.important,createdAt:Date.now()};}
function addTask(raw){
  if(!raw.trim()||readOnly) return;
  const p=parseSmart(tidy(raw),{scope:"day",date:ui.day,today:new Date()});
  const t=makeTask(p); put(t);
  const shown=(t.scope==="day"&&t.date===ui.day);
  if(!shown) toast(whereLabel(t)+" tarihine eklendi",()=>{if(t.scope==="day"){ui.day=t.date;ui.month=t.date.slice(0,7)}else ui.month=t.date;render();},"Göster");
  else if(wantsCountdown(t)&&t.date>todayStr()) toast("Geri sayıma eklendi: "+daysUntil(t.date)+" gün kaldı");
}
function toggle(t){put(Object.assign({},t,{done:!t.done,doneAt:!t.done?Date.now():null}));}
function postpone(t){
  const date=t.scope==="day"?ymd(addDays(parseYmd(t.date),1)):ym(addMonths(parseYm(t.date),1));
  put(Object.assign({},t,{date}));
  toast(t.scope==="day"?"Yarına taşındı":"Sonraki aya taşındı",()=>put(t));
}
function remove(t){if(sheetId===t.id)closeSheet();del(t);toast("Silindi",()=>put(t));}
function toggleNoteItem(key){
  const nid=key.split(":")[0]; const n=notes.get(nid); if(!n||readOnly) return;
  const done=Object.assign({},n.done||{}); if(done[key]) delete done[key]; else done[key]=true;
  putNote(Object.assign({},n,{done})); render();
}

function firstLine(s){return String(s||"").split("\n").find(l=>l.trim())||"";}
const cdText=d=>d===0?"Bugün":d===1?"Yarın":d+" gün kaldı";

// tek satır bileşeni: iş ya da not satırı
function itemRow(it,opts={}){
  const isTask=it.kind==="task", isFair=it.kind==="fair", t=it.t;
  const id=isTask?`data-id="${t.id}"`:isFair?`data-fstage="${it.f.id}|${it.s.key}"`:`data-key="${esc(it.i.key)}"`;
  const chips=[];
  if(opts.date) chips.push(`<span class="mini${it.date<todayStr()&&!it.done&&it.scope==="day"?" cd":""}">${esc(shortDate(it))}${it.date<todayStr()&&!it.done&&it.scope==="day"?" · gecikti":""}</span>`);
  if(isFair) chips.push(`<span class="mini cd">${I.hourglass}Fuar · ${esc(cdText(Math.max(0,daysUntil(it.f.start))))}</span>`);
  else if(!isTask){const n=notes.get(it.i.noteId); chips.push(`<span class="mini">${I.note}${esc((n?noteTitle(n):"Not").slice(0,32))}</span>`);}
  if(isTask){const subs=Array.isArray(t.subs)?t.subs:[], sd=subs.filter(s=>s.done).length; if(subs.length) chips.push(`<span class="mini${sd===subs.length?" all":""}">${I.list}${sd}/${subs.length}</span>`);}
  const cd=!isFair&&!it.done&&it.scope==="day"&&it.date>=todayStr()&&(isTask?wantsCountdown(t):FAIR.test(it.text));
  if(cd) chips.push(`<span class="mini cd">${I.hourglass}${cdText(daysUntil(it.date))}</span>`);
  const desc=isTask&&t.desc&&firstLine(t.desc)?`<span class="task-desc">${esc(firstLine(t.desc))}</span>`:"";
  return `<li class="task${it.done?" done":""}${it.important?" important":""}" ${id}>
    <button class="check" data-act="toggle" aria-label="${it.done?"Tamamlanmadı olarak işaretle":"Tamamlandı olarak işaretle"}">${I.check}</button>

    </div>
    ${isTask&&!opts.noActs?`<div class="acts">
      ${it.done?"":`<button class="act" data-act="next" title="${t.scope==="day"?"Yarına at":"Sonraki aya at"}" aria-label="Ertele">${I.next}</button>`}
      <button class="act del" data-act="del" title="Sil" aria-label="Sil">${I.trash}</button></div>`:""}
  </li>`;
}

const noteDirty=new Set(); let noteTimer=null;
const OK_TAGS={DIV:1,P:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,H2:1,H3:1,UL:1,OL:1,LI:1,TABLE:1,TBODY:1,THEAD:1,TR:1,TD:1,TH:1,FIGURE:1,SPAN:1};
const DROP_TAGS={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,LINK:1,META:1,SVG:1,IMG:1,VIDEO:1,AUDIO:1};
const OK_ATTR=["class","data-done","data-sketch"];
function sanitize(html){
  const doc=new DOMParser().parseFromString("<div>"+(html||"")+"</div>","text/html");
  const walk=el=>{[...el.childNodes].forEach(c=>{
    if(c.nodeType===3) return;
    if(c.nodeType!==1){c.remove();return;}
    if(DROP_TAGS[c.tagName]){c.remove();return;}
    walk(c);
    if(!OK_TAGS[c.tagName]){c.replaceWith(...c.childNodes);return;}
    [...c.attributes].forEach(a=>{if(!OK_ATTR.includes(a.name))c.removeAttribute(a.name);});
  });};
  const root=doc.body.firstChild; walk(root); return root.innerHTML;
}
const htmlFromBody=b=>String(b||"").split("\n").map(l=>`<div>${l.trim()?esc(l):"<br>"}</div>`).join("");
const noteHtml=n=>typeof n.html==="string"?n.html:htmlFromBody(n.body);
function noteDate(n){
  const open=noteItems(n).filter(i=>!i.done&&i.scope==="day").map(i=>i.date).sort();
  return open.filter(d=>d>=todayStr())[0]||open[open.length-1]||null;
}
function sortedNotes(){
  return [...notes.values()].map(n=>({n,date:noteDate(n)})).sort((x,y)=>x.date&&y.date?(x.date<y.date?-1:x.date>y.date?1:0):x.date?-1:y.date?1:(y.n.updatedAt||0)-(x.n.updatedAt||0));
}
function nlistHtml(){
  const q=ui.q.trim().toLocaleLowerCase("tr-TR");

  const draft=`<button class="np${ui.noteId==="draft"?" on":""}" data-note-open="draft"><span class="np-t">Yeni sayfa</span><span class="np-s">Dokunun ve yazmaya başlayın</span></button>`;
  return (q?"":draft)+list.map(({n,date})=>{
    const rest=String(n.body||"").split("\n").filter(l=>l.trim()).slice(1,2).join(" ");
    const sk=n.sketches&&Object.keys(n.sketches).length, tb=/<table/i.test(n.html||"");
    return `<button class="np${ui.noteId===n.id?" on":""}" data-note-open="${n.id}">
      <span class="np-t">${esc(noteTitle(n))}</span>
      <span class="np-s">${date?`<b class="${date<todayStr()?"late":FAIR.test(n.body||"")?"fair":""}">${esc(shortDate({scope:"day",date}))}</b> `:""}${esc(rest||(sk?"Çizim":tb?"Tablo":"Ek metin yok"))}</span></button>`;}).join("")
    +(q&&!list.length?`<p class="hint">“${esc(ui.q)}” bulunamadı.</p>`:"");
}
function detectedHtml(n){
  const items=n?noteItems(n):[];
  if(!items.length) return `<p class="hint">İpucu: bir satıra tarih yazın, takvime kendiliğinden düşer. <b>12 kasım</b> stand kurulumu · <b>yarın 14:00</b> görüşme · <b>cuma</b> numune gönder</p>`;
  return `<div class="section-head"><h2>Takvime işlenenler · ${items.length}</h2></div>${listOf(items.map(noteItem),{date:true})}`;
}
const TOOLS=[["h","Başlık",'<b style="font-family:var(--font-display);font-size:15px">Aa</b>'],["b","Kalın",'<b>B</b>'],["ul","Madde listesi",SV('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/>')],["chk","Yapılacaklar",SV('<circle cx="6" cy="7" r="2.5"/><path d="M11 7h9"/><circle cx="6" cy="17" r="2.5"/><path d="M11 17h9"/>')],["table","Tablo",SV('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/>')],["draw","Kalemle çiz",SV('<path d="M3 21l3.5-1 11-11-2.5-2.5-11 11z"/><path d="M14 6.5L16.5 9"/><path d="M14 21c2-2 4-2 7-1"/>')]];

function markEmpty(ed){ed.classList.toggle("is-empty",!ed.textContent.trim()&&!ed.querySelector("figure,table,li"));}
function ensureBlocks(ed){
  if(!ed.firstChild){ed.innerHTML="<div><br></div>";return;}
  // çıplak metinleri satır bloğuna sar
  [...ed.childNodes].forEach(c=>{if(c.nodeType===3&&c.textContent.trim()){const d=document.createElement("div");c.replaceWith(d);d.appendChild(c);}else if(c.nodeType===1&&c.tagName==="BR"){const d=document.createElement("div");c.replaceWith(d);d.appendChild(c);}});
}
function hydrateEditor(){
  const ed=document.getElementById("ned"); if(!ed) return;
  try{document.execCommand("defaultParagraphSeparator",false,"div");}catch(e){}
  ensureBlocks(ed); markEmpty(ed);
  const n=notes.get(ed.dataset.note);
  ed.querySelectorAll("figure.sketch").forEach(f=>{f.setAttribute("contenteditable","false");const s=n&&n.sketches&&n.sketches[f.dataset.sketch];f.innerHTML=s?sketchSvg(s):"";if(!s)f.remove();});
}
function editorHtmlForSave(ed){
  const c=ed.cloneNode(true); c.querySelectorAll("figure.sketch").forEach(f=>f.innerHTML="");
  return sanitize(c.innerHTML);
}
function editorText(ed){
  const c=ed.cloneNode(true);
  c.querySelectorAll("td,th").forEach(td=>td.append(" "));
  c.querySelectorAll("div,p,li,h2,h3,tr,br").forEach(el=>{if(el.tagName==="BR")el.replaceWith("\n");else el.append("\n");});
  return c.textContent.replace(/\n{3,}/g,"\n\n").trim();
}
function saveEditorSoon(){
  const ed=document.getElementById("ned"); if(!ed||readOnly) return;
  if([...ed.childNodes].some(c=>c.nodeType===3&&c.textContent.trim())){
    // imleci koruyarak çıplak metni sar
    const sel=getSelection(); const node=sel.anchorNode, off=sel.anchorOffset; ensureBlocks(ed);
    if(node&&ed.contains(node)){const r=document.createRange();r.setStart(node,Math.min(off,node.length||0));r.collapse(true);sel.removeAllRanges();sel.addRange(r);}
  }
  markEmpty(ed);
  let id=ed.dataset.note;
  if(id==="draft"){
    if(!ed.textContent.trim()&&!ed.querySelector("figure,table")) return;
    const n={id:newId(),html:"",body:"",sketches:{},done:{},createdAt:Date.now(),updatedAt:Date.now()};
    notes.set(n.id,n); id=n.id; ed.dataset.note=id; ui.noteId=id;
  }
  const n=notes.get(id); if(!n) return;
  notes.set(id,Object.assign({},n,{html:editorHtmlForSave(ed),body:editorText(ed),updatedAt:Date.now()}));
  noteDirty.add(id);
  refreshNoteSide();
  clearTimeout(noteTimer);
  noteTimer=setTimeout(()=>flushNote(id),700);
}
function flushNote(id){
  clearTimeout(noteTimer); const n=notes.get(id); if(!n) return;

/* imleç ve bloklar */
let savedRange=null;
function curBlock(){
  const sel=getSelection(); if(!sel.rangeCount) return null;
  let n=sel.anchorNode; const ed=document.getElementById("ned"); if(!ed||!ed.contains(n)) return null;
  if(n.nodeType===3) n=n.parentNode;
  return n.closest?n.closest("li,div,p,h2,h3,td,th"):null;
}
function inEditor(){const sel=getSelection();const ed=document.getElementById("ned");return ed&&sel.rangeCount&&ed.contains(sel.anchorNode);}
function placeCaretIn(el){const r=document.createRange();r.selectNodeContents(el);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);}
function updateTableTools(){
  const tt=document.getElementById("ttools"); if(!tt) return;
  const b=curBlock(); tt.hidden=!(b&&b.closest("table"));
}
function runTool(k){
  const ed=document.getElementById("ned"); if(!ed||readOnly) return;
  if(!inEditor()){ed.focus(); if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange);} else {const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);}}
  if(k==="b") document.execCommand("bold");
  else if(k==="h"){const b=curBlock();document.execCommand("formatBlock",false,b&&b.tagName==="H2"?"div":"h2");}
  else if(k==="ul"||k==="chk"){
    const b=curBlock(); const ul=b&&b.closest("ul");
    if(ul&&((k==="chk")===ul.classList.contains("checklist"))) document.execCommand("insertUnorderedList");
    else if(ul){ul.classList.toggle("checklist",k==="chk");}
    else{document.execCommand("insertUnorderedList");const nb=curBlock();const nu=nb&&nb.closest("ul");if(nu&&k==="chk")nu.classList.add("checklist");}
  }
  else if(k==="table"){
    const row="<tr>"+"<td><br></td>".repeat(3)+"</tr>";
    document.execCommand("insertHTML",false,`<table class="ntable"><tbody>${row}${row}${row}</tbody></table><div><br></div>`);
    const tds=ed.querySelectorAll("table.ntable td"); // ilk boş hücreye geç
    for(const td of tds){if(!td.textContent.trim()){placeCaretIn(td);break;}}
  }
  else if(k==="draw"){savedRange=getSelection().rangeCount?getSelection().getRangeAt(0).cloneRange():null;openDraw(null);return;}
  else if(/^(row|col)[+-]$/.test(k)){
    const td=curBlock()&&curBlock().closest("td,th"); if(!td) return;
    const tr=td.parentNode, table=tr.closest("table"), ci=[...tr.children].indexOf(td);
    if(k==="row+"){const n=document.createElement("tr");n.innerHTML="<td><br></td>".repeat(tr.children.length);tr.after(n);placeCaretIn(n.children[ci]);}
    else if(k==="row-"){if(table.rows.length>1){const nx=tr.nextElementSibling||tr.previousElementSibling;tr.remove();placeCaretIn(nx.children[Math.min(ci,nx.children.length-1)]);}else{table.remove();}}
    else if(k==="col+"){[...table.rows].forEach(r=>{const c=document.createElement("td");c.innerHTML="<br>";r.children[ci].after(c);});placeCaretIn(tr.children[ci+1]);}
    else if(k==="col-"){if(tr.children.length>1){[...table.rows].forEach(r=>r.children[ci].remove());placeCaretIn(tr.children[Math.max(0,ci-1)]);}else table.remove();}
  }
  saveEditorSoon(); updateTableTools();
}

/* ---------- kalemle çizim ---------- */
const PEN={ink:"currentColor",red:"#CD1E25",blue:"#2463EB",green:"#1E7A4F"};
const ptsToD=p=>{const a=p.trim().split(" ").map(Number);if(a.length<4)return a.length?`M${a[0]} ${a[1]}l0.1 0`:"";let d=`M${a[0]} ${a[1]}`;
  for(let i=2;i<a.length-2;i+=2){const mx=(a[i]+a[i+2])/2,my=(a[i+1]+a[i+3])/2;d+=`Q${a[i]} ${a[i+1]} ${mx.toFixed(0)} ${my.toFixed(0)}`;}
  return d+`L${a[a.length-2]} ${a[a.length-1]}`;};
const sketchSvg=s=>`<svg viewBox="0 0 ${s.w} ${s.h}" role="img" aria-label="Çizim">${(s.strokes||[]).map(k=>`<path d="${ptsToD(k.p)}" stroke="${PEN[k.c]||"currentColor"}" stroke-width="${k.s}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`).join("")}</svg>`;
let draw=null;
function openDraw(figId){
  const ed=document.getElementById("ned"); const n=notes.get(ed&&ed.dataset.note);
  const ex=figId&&n&&n.sketches&&n.sketches[figId];
  draw={id:figId||newId(),w:1000,h:ex?ex.h:625,strokes:ex?JSON.parse(JSON.stringify(ex.strokes)):[],color:"ink",size:4,mode:"pen",cur:null,isNew:!ex};
  const ov=document.createElement("div"); ov.className="draw-ov"; ov.id="drawOv";
  ov.innerHTML=`<div class="draw-box"><div class="draw-bar">
      <div class="draw-grp">${Object.keys(PEN).map(c=>`<button class="dot-btn${c===draw.color?" on":""}" data-pen="${c}" aria-label="Renk" style="--c:${c==="ink"?"var(--ink)":PEN[c]}"></button>`).join("")}</div>
      <div class="draw-grp">${[2,4,9].map(s=>`<button class="size-btn${s===draw.size?" on":""}" data-size="${s}" aria-label="Kalınlık ${s}"><i style="width:${s+3}px;height:${s+3}px"></i></button>`).join("")}</div>
      <div class="draw-grp"><button class="ntool sm${draw.mode==="erase"?" on":""}" data-dmode="erase">Silgi</button><button class="ntool sm" data-dact="undo">Geri al</button><button class="ntool sm" data-dact="clear">Temizle</button></div>
    </div>
    <div class="draw-pad"><canvas id="drawCv"></canvas></div>
    <div class="draw-foot">${draw.isNew?"":`<button class="del-btn" data-dact="delete">${I.trash}Çizimi sil</button>`}<span class="grow"></span><button class="btn ghost" data-dact="cancel">Vazgeç</button><button class="btn primary" data-dact="done">Bitti</button></div></div>`;
  document.body.appendChild(ov);
  const cv=document.getElementById("drawCv"); sizeCanvas(cv); redraw();
  cv.addEventListener("pointerdown",dDown); cv.addEventListener("pointermove",dMove); cv.addEventListener("pointerup",dUp); cv.addEventListener("pointercancel",dUp); cv.addEventListener("pointerleave",dUp);
  ov.addEventListener("click",dClick);
}
function sizeCanvas(cv){
  const pad=cv.parentNode, wpx=pad.clientWidth-24, hpx=Math.round(wpx*draw.h/draw.w), dpr=window.devicePixelRatio||1;
  cv.style.width=wpx+"px"; cv.style.height=hpx+"px"; cv.width=wpx*dpr; cv.height=hpx*dpr; draw.scale=draw.w/wpx; draw.dpr=dpr;
}
function redraw(){
  const cv=document.getElementById("drawCv"); if(!cv) return; const g=cv.getContext("2d");
  const k=cv.width/draw.w; g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,cv.width,cv.height); g.setTransform(k,0,0,k,0,0);
  const ink=getComputedStyle(document.body).color;
  draw.strokes.concat(draw.cur?[draw.cur]:[]).forEach(s=>{g.strokeStyle=s.c==="ink"?ink:PEN[s.c];g.lineWidth=s.s;g.lineCap="round";g.lineJoin="round";g.stroke(new Path2D(ptsToD(s.p)));});
}
function dPt(e){const r=e.target.getBoundingClientRect();return [Math.round((e.clientX-r.left)*draw.scale),Math.round((e.clientY-r.top)*draw.scale)];}
function dDown(e){e.preventDefault();e.target.setPointerCapture(e.pointerId);const [x,y]=dPt(e);
  if(draw.mode==="erase"){eraseAt(x,y);draw.erasing=true;return;}
  draw.cur={c:draw.color,s:draw.size,p:x+" "+y};redraw();}
function dMove(e){if(!draw)return;const [x,y]=dPt(e);
  if(draw.erasing){eraseAt(x,y);return;}
  if(!draw.cur)return;const last=draw.cur.p.split(" ").slice(-2).map(Number);if(Math.hypot(x-last[0],y-last[1])<3)return;draw.cur.p+=" "+x+" "+y;redraw();}
function dUp(){if(!draw)return;draw.erasing=false;if(draw.cur){draw.strokes.push(draw.cur);draw.cur=null;redraw();}}
function eraseAt(x,y){const before=draw.strokes.length;draw.strokes=draw.strokes.filter(s=>{const a=s.p.split(" ").map(Number);for(let i=0;i<a.length;i+=2)if(Math.hypot(a[i]-x,a[i+1]-y)<18)return false;return true;});if(draw.strokes.length!==before)redraw();}
function dClick(e){
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.pen){draw.color=b.dataset.pen;draw.mode="pen";}
  else if(b.dataset.size){draw.size=+b.dataset.size;draw.mode="pen";}
  else if(b.dataset.dmode){draw.mode=draw.mode==="erase"?"pen":"erase";}
  else if(b.dataset.dact==="undo"){draw.strokes.pop();redraw();}
  else if(b.dataset.dact==="clear"){draw.strokes=[];redraw();}
  else if(b.dataset.dact==="cancel"){closeDraw();return;}
  else if(b.dataset.dact==="delete"){removeSketch(draw.id);closeDraw();return;}
  else if(b.dataset.dact==="done"){commitSketch();closeDraw();return;}
  const ov=document.getElementById("drawOv");
  ov.querySelectorAll("[data-pen]").forEach(x=>x.classList.toggle("on",x.dataset.pen===draw.color&&draw.mode==="pen"));
  ov.querySelectorAll("[data-size]").forEach(x=>x.classList.toggle("on",+x.dataset.size===draw.size));
  ov.querySelector("[data-dmode]").classList.toggle("on",draw.mode==="erase");
}
function closeDraw(){const ov=document.getElementById("drawOv");if(ov)ov.remove();draw=null;}
function commitSketch(){
  if(!draw.strokes.length){if(!draw.isNew)removeSketch(draw.id);return;}
  // çizimi sıkıştır: kullanılan yüksekliğe kırp
  let maxY=0; draw.strokes.forEach(s=>{const a=s.p.split(" ").map(Number);for(let i=1;i<a.length;i+=2)maxY=Math.max(maxY,a[i]+s.s);});
  const sk={w:draw.w,h:Math.min(draw.h,Math.max(160,Math.ceil(maxY+20))),strokes:draw.strokes};
  const ed=document.getElementById("ned"); if(!ed) return;
  if(draw.isNew){
    let top=savedRange&&ed.contains(savedRange.startContainer)?savedRange.startContainer:null;
    while(top&&top.parentNode!==ed) top=top.parentNode;
    const fig=document.createElement("figure"); fig.className="sketch"; fig.dataset.sketch=draw.id;
    const after=document.createElement("div"); after.innerHTML="<br>";
    if(top&&top.textContent.trim()===""&&top.tagName==="DIV"&&!top.querySelector("figure,table")) top.replaceWith(fig); else if(top) top.after(fig); else ed.appendChild(fig);
    fig.after(after); placeCaretIn(after);
  }
  // önce taslaksa sayfayı oluştur
  if(ed.dataset.note==="draft"){ed.dataset.note=newId();const n={id:ed.dataset.note,html:"",body:"",sketches:{},done:{},createdAt:Date.now(),updatedAt:Date.now()};notes.set(n.id,n);ui.noteId=n.id;}
  const n=notes.get(ed.dataset.note); notes.set(n.id,Object.assign({},n,{sketches:Object.assign({},n.sketches||{},{[draw.id]:sk})}));
  hydrateEditor(); saveEditorSoon();
}
function removeSketch(id){
  const ed=document.getElementById("ned"); if(!ed) return; const f=ed.querySelector(`figure[data-sketch="${id}"]`); if(f) f.remove();
  const n=notes.get(ed.dataset.note); if(n&&n.sketches){const s=Object.assign({},n.sketches);delete s[id];notes.set(n.id,Object.assign({},n,{sketches:s}));}
  saveEditorSoon();
}
window.addEventListener("resize",()=>{const cv=document.getElementById("drawCv");if(cv&&draw){sizeCanvas(cv);redraw();}});

/* yazarken: satır bitince düzelt, yapıştırırken düz metin */
function tidyPrevBlock(){
  const b=curBlock(); if(!b) return; const prev=b.previousElementSibling;
  if(!prev||prev.children.length||!/^(DIV|P|LI|H2|H3)$/.test(prev.tagName)) return;

}

/* ---------- Fuar Panosu ---------- */
// açılıştan geriye gün farkı; söküm bitişten sonra
const STAGES=[["teklif","Teklif",-60],["tasarim","Tasarım onayı",-45],["uretim","Üretim",-30],["nakliye","Nakliye",-5],["kurulum","Kurulum",-3],["acilis","Açılış",0],["sokum","Söküm","end+0"]];
function stagesFor(start,end){
  return STAGES.map(([key,label,off])=>({key,label,date:off==="end+0"?(end||start):ymd(addDays(parseYmd(start),off)),done:false}));
}
// her fuarda tekrar eden işler; gün farkı açılışa göre, null = tarihsiz
const CHECKS=[["Organizatör teknik formu",-30],["Elektrik başvurusu",-25],["Asma (rigging) başvurusu",-25],["Su ve internet başvurusu",-20],["Mobilya kiralama",-10],["Grafik baskı",-7],["Stand personeli giriş kartları",-7],["Halı / zemin",-5]];
// yeni fuar, en son eklenen fuarın listesini örnek alır; yoksa varsayılan
function checksFor(start){
  const last=[...fairs.values()].filter(f=>Array.isArray(f.checks)&&f.checks.length).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  const src=last?last.checks.map(c=>[c.text,c.off]):CHECKS;
  return src.map(([text,off])=>({id:newId(),text,off:off==null?null:off,date:off==null?null:ymd(addDays(parseYmd(start),off)),done:false}));
}
const fairChecks=f=>Array.isArray(f.checks)?f.checks:[];
// liste maddesini aşama gibi göster (takvim ve haftalık liste için)
const checkAsStage=c=>({key:"c:"+c.id,label:c.text,date:c.date,done:!!c.done,check:true});
const fairEnd=f=>f.end&&f.end>=f.start?f.end:f.start;
const fairList=()=>[...fairs.values()].sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);
const activeFairs=()=>fairList().filter(f=>fairEnd(f)>=todayStr());
function nextStage(f){return (f.stages||[]).filter(s=>!s.done).sort((a,b)=>a.date<b.date?-1:1)[0]||null;}
function fairStatus(f){
  const t=todayStr();
  if(t>=f.start&&t<=fairEnd(f)) return {k:"live",txt:"Fuar sürüyor"};
  if(t>fairEnd(f)) return {k:"past",txt:"Bitti"};
  const late=(f.stages||[]).filter(s=>!s.done&&s.date<t), lateC=fairChecks(f).filter(c=>!c.done&&c.date&&c.date<t);
  if(late.length) return {k:"late",txt:late.length+" aşama gecikti"};
  if(lateC.length) return {k:"late",txt:lateC.length+" liste maddesi gecikti"};
  return {k:"ok",txt:"Planında"};
}
function addFair(raw){
  if(readOnly) return;
  const txt=tidy(raw.trim()); if(!txt) return;
  const p=parseSmart(txt,{scope:"none",date:null,today:new Date()});
  if(p.scope!=="day"||!p.found.length){toast("Fuarın tarihini de yazın. Örnek: Mobilya Fuarı 15 kasım");return false;}
  // "15-18 kasım" gibi aralık
  let end=null; const m=txt.match(/(\d{1,2})\s*[-–]\s*(\d{1,2})\s+\p{L}+/u);
  if(m){const d=parseYmd(p.date);const e=new Date(d.getFullYear(),d.getMonth(),+m[2]);if(e>=d)end=ymd(e);}
  const start=m?ymd(new Date(parseYmd(p.date).getFullYear(),parseYmd(p.date).getMonth(),+m[1])):p.date;
  const name=p.text.replace(/^[\d\s–-]+/,"").replace(/\s*\d{1,2}\s*[-–]?\s*$/,"").trim()||"Yeni fuar";
  const f={id:newId(),name:cap(name),client:"",venue:"",start,end:end||ymd(addDays(parseYmd(start),3)),notes:"",stages:[],createdAt:Date.now()};
  f.stages=stagesFor(f.start,f.end).map(st=>Object.assign(st,{done:st.date<todayStr()&&st.key!=="sokum"&&st.key!=="acilis"}));
  f.checks=checksFor(f.start);
  putFair(f); render();
  toast(f.name+" eklendi · "+cdText(daysUntil(f.start)));
  return true;
}
function toggleStage(fid,key){
  const f=fairs.get(fid); if(!f||readOnly) return;
  if(key.startsWith("c:")){const cid=key.slice(2);putFair(Object.assign({},f,{checks:fairChecks(f).map(c=>c.id===cid?Object.assign({},c,{done:!c.done}):c)}));render();return;}
  putFair(Object.assign({},f,{stages:f.stages.map(s=>s.key===key?Object.assign({},s,{done:!s.done}):s)})); render();
}
// takvim için aşama kalemleri
function fairItemsOn(date){
  const out=[];
  fairs.forEach(f=>(f.stages||[]).concat(fairChecks(f).filter(c=>c.date).map(checkAsStage)).forEach(s=>{if(s.date===date) out.push({kind:"fair",f,s,done:!!s.done,date,time:null,text:f.name+" · "+s.label,important:s.key==="acilis",scope:"day"});}));
  return out;
}
const inFair=d=>[...fairs.values()].some(f=>d>=f.start&&d<=fairEnd(f));

function seasonHtml(){
  const base=new Date(); base.setDate(1); const months=[...Array(12)].map((_,i)=>addMonths(base,i));
  const from=ymd(months[0]), to=ymd(new Date(months[11].getFullYear(),months[11].getMonth()+1,0));
  const total=(parseYmd(to)-parseYmd(from))/864e5+1;
  const pos=d=>Math.max(0,Math.min(100,((parseYmd(d)-parseYmd(from))/864e5)/total*100));
  const list=fairList().filter(f=>fairEnd(f)>=from&&f.start<=to);
  const rows=[]; list.forEach(f=>{let r=0;while(rows[r]&&rows[r]>=f.start)r++;rows[r]=ymd(addDays(parseYmd(f.start),48));f._row=r;});
  const nowX=pos(todayStr());
  return `<div class="season" style="--rows:${Math.max(1,rows.length)}">
    <div class="season-m">${months.map(m=>`<span>${esc(cap(new Intl.DateTimeFormat("tr-TR",{month:"short"}).format(m)))}</span>`).join("")}</div>
    <div class="season-t">${months.map(()=>`<i></i>`).join("")}
      <b class="season-now" style="left:${nowX}%"></b>
      ${list.map(f=>{const l=pos(f.start),w=Math.max(1.2,pos(fairEnd(f))-l+100/total);const st=fairStatus(f).k;
        return `<button class="season-bar ${st}" data-fair="${f.id}" style="left:${l}%;width:${w}%;top:${f._row*30+6}px" title="${esc(f.name)}"><span>${esc(f.name)}</span></button>`}).join("")}
    </div></div>`;
}
function fairCard(f){
  const d=daysUntil(f.start), st=fairStatus(f), stages=f.stages||[], done=stages.filter(s=>s.done).length, nx=nextStage(f);
  const big=st.k==="live"?"Şu an":st.k==="past"?"Bitti":d===0?"Bugün":d;
  return `<article class="fcard ${st.k}" data-fair="${f.id}">
    <div class="fc-left"><span class="fc-num">${big}</span><span class="fc-lbl">${typeof big==="number"?"gün kaldı":""}</span></div>
    <div class="fc-main">
      <div class="fc-head"><h3>${esc(f.name)}</h3><span class="pill ${st.k}">${esc(st.txt)}</span></div>
      <p class="fc-sub">${esc(fmtShort.format(parseYmd(f.start)))}${fairEnd(f)!==f.start?" – "+esc(fmtShort.format(parseYmd(fairEnd(f)))):""}${f.client?" · "+esc(f.client):""}${f.venue?" · "+esc(f.venue):""}</p>
      <div class="stages">${stages.map(s=>`<button class="stg${s.done?" done":s.date<todayStr()?" late":nx&&nx.key===s.key?" next":""}" data-stage="${f.id}|${s.key}" title="${esc(s.label)} · ${esc(fmtShort.format(parseYmd(s.date)))}"><i>${s.done?I.check:""}</i><span>${esc(s.label)}</span><em>${esc(shortDate({scope:"day",date:s.date}))}</em></button>`).join("")}</div>
      <div class="fc-foot"><div class="bar"><i style="width:${stages.length?Math.round(done/stages.length*100):0}%"></i></div><span>${done}/${stages.length} aşama</span>${fairChecks(f).length?`<span class="fc-chk">${I.list}Liste ${fairChecks(f).filter(c=>c.done).length}/${fairChecks(f).length}</span>`:""}${nx&&st.k!=="past"?`<span class="fc-next">Sıradaki: <b>${esc(nx.label)}</b> · ${esc(shortDate({scope:"day",date:nx.date}))}</span>`:""}</div>
    </div></article>`;
}
function renderFairs(){
  const act=activeFairs(), past=fairList().filter(f=>fairEnd(f)<todayStr()).reverse();
  const weekEnd=ymd(addDays(new Date(),7));
  const thisWeek=[]; act.forEach(f=>(f.stages||[]).concat(fairChecks(f).filter(c=>c.date).map(checkAsStage)).forEach(s=>{if(!s.done&&s.date<=weekEnd)thisWeek.push({f,s});}));
  thisWeek.sort((a,b)=>a.s.date<b.s.date?-1:1);
  return `<div class="period"><div><div class="eyebrow">${act.length} aktif fuar</div><h1>Fuar Panosu</h1></div></div>
    <form class="add" id="fairForm" autocomplete="off">
      <input id="fairInput" placeholder="Fuar adı ve tarihi, ör. İstanbul Mobilya Fuarı 15-18 kasım" aria-label="Yeni fuar" enterkeyhint="done" ${readOnly?"disabled":""}>
      <button type="submit" class="add-btn" ${readOnly?"disabled":""}>${I.plus}<span>Fuar ekle</span></button>

let fairDraft=null;
function openFair(id){
  const f=fairs.get(id); if(!f) return;
  sheetId="fair:"+id; fairDraft=JSON.parse(JSON.stringify(f)); drawFairSheet(); $sheet.hidden=false;

function flushFair(){
  if(!fairDraft||readOnly) return; const cur=fairs.get(fairDraft.id); if(!cur) return;
  const d=JSON.parse(JSON.stringify(fairDraft)); d.name=tidy((d.name||"").trim())||cur.name; d.client=tidy(d.client||""); d.venue=tidy(d.venue||""); if(Array.isArray(d.checks)) d.checks=d.checks.map(c=>Object.assign(c,{text:tidy((c.text||"").trim())})).filter(c=>c.text);
  if(JSON.stringify(d)!==JSON.stringify(cur)){putFair(d);render();}
}

        ${ro?"":`<input class="inp" id="fsCheckNew" placeholder="Madde ekle, Enter'a basın" enterkeyhint="done">`}
