let fairTimer=null;
function fairSheetEvent(e){
  if(!fairDraft) return false; const el=e.target, t=e.type;
  if(t==="input"){
    if(el.id==="fsName") fairDraft.name=el.value.replace(/\n/g," ");
    else if(el.id==="fsClient") fairDraft.client=el.value; else if(el.id==="fsVenue") fairDraft.venue=el.value;
    else if(el.id==="fsNotes"){fairDraft.notes=el.value;el.style.height="auto";el.style.height=Math.max(110,el.scrollHeight)+"px";}
    else if(el.dataset.fsLabel){const s=fairDraft.stages.find(x=>x.key===el.dataset.fsLabel);if(s)s.label=el.value;}
    else if(el.dataset.fsCtext){const c=fairChecks(fairDraft).find(x=>x.id===el.dataset.fsCtext);if(c)c.text=el.value;}
    else return true;
    clearTimeout(fairTimer); fairTimer=setTimeout(flushFair,500); return true;
  }
  if(t==="change"){
    if(el.id==="fsStart"&&el.value){const len=daysBetween(fairDraft.start,fairEnd(fairDraft));fairDraft.start=el.value;fairDraft.end=ymd(addDays(parseYmd(el.value),len));flushFair();drawFairSheet();toast("Tarih değişti. Aşamaları kaydırmak için “yeniden hesapla”ya dokunun.");}
    else if(el.id==="fsEnd"&&el.value){fairDraft.end=el.value<fairDraft.start?fairDraft.start:el.value;flushFair();drawFairSheet();}
    else if(el.dataset.fsCdate!==undefined){const c=fairChecks(fairDraft).find(x=>x.id===el.dataset.fsCdate);if(c){c.date=el.value||null;c.off=el.value?daysBetween(fairDraft.start,el.value):null;}flushFair();drawFairSheet();}
    else if(el.dataset.fsDate&&el.value){const s=fairDraft.stages.find(x=>x.key===el.dataset.fsDate);if(s)s.date=el.value;flushFair();drawFairSheet();}
    return true;
  }
  if(t==="click"){
    const b=el.closest("button"); if(!b) return true; const a=b.dataset.fs;
    if(a==="close"){closeSheet();return true;}
    if(readOnly) return true;
    if(a==="stage"){const s=fairDraft.stages.find(x=>x.key===b.closest("[data-stg]").dataset.stg);if(s)s.done=!s.done;}
    else if(a==="chk"){const c=fairChecks(fairDraft).find(x=>x.id===b.closest("[data-chk]").dataset.chk);if(c)c.done=!c.done;}
    else if(a==="cdel"){const cid=b.closest("[data-chk]").dataset.chk;fairDraft.checks=fairChecks(fairDraft).filter(x=>x.id!==cid);}
    else if(a==="replan"){const fresh=stagesFor(fairDraft.start,fairEnd(fairDraft));fairDraft.stages=fairDraft.stages.map(s=>{const n=fresh.find(x=>x.key===s.key);return n?Object.assign({},s,{date:n.date}):s;});fairDraft.checks=fairChecks(fairDraft).map(c=>c.off==null?c:Object.assign({},c,{date:ymd(addDays(parseYmd(fairDraft.start),c.off))}));toast("Aşama tarihleri yeniden hesaplandı");}
    else if(a==="del"){const f=fairs.get(fairDraft.id);closeSheet();if(f){delFair(f);render();toast("Fuar silindi",()=>{putFair(f);render();});}return true;}
    else return true;
    flushFair(); drawFairSheet(); return true;
  }
  return true;
}
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);

/* ---------- Takvim ---------- */
function renderCal(){
  const m=parseYm(ui.month), today=todayStr();
  const offset=(m.getDay()+6)%7, days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  let cells=DN.map(n=>`<div class="cal-dn">${n}</div>`).join("");
  for(let i=0;i<offset;i++) cells+=`<div class="cal-cell out"></div>`;
  for(let i=1;i<=days;i++){
    const s=ui.month+"-"+pad(i), di=itemsOn("day",s), dn=di.filter(x=>x.done).length;
    const fair=di.some(x=>!x.done&&(x.kind==="task"?wantsCountdown(x.t):FAIR.test(x.text)));
    cells+=`<button class="cal-cell${s===today?" is-today":""}${di.length?" has":""}${fair||inFair(s)?" fair":""}" data-day="${s}" ${s===ui.day?'aria-current="date"':""} aria-label="${fmtLong.format(parseYmd(s))}, ${di.length} iş">${i}<span class="cnt${di.length&&dn===di.length?" all":""}">${di.length?dn+"/"+di.length:""}</span></button>`;
  }
  const d=parseYmd(ui.day), items=sortItems(itemsOn("day",ui.day));
  const openN=items.filter(x=>!x.done).length;
  const monthItems=sortItems(itemsOn("month",ui.month));
  const od=ui.day===today?overdue():[];
  return `<div class="period"><div><div class="eyebrow">Takvim</div><h1>${esc(cap(fmtMonth.format(m)))}</h1></div>
      <div class="nav">${ui.month===ym(new Date())&&ui.day===today?"":`<button class="today-btn" data-go="today">Bugün</button>`}
      <button class="icon-btn" data-step="-1" aria-label="Önceki ay">${I.left}</button><button class="icon-btn" data-step="1" aria-label="Sonraki ay">${I.right}</button></div></div>
    <div class="cal"><div class="cal-grid">${cells}</div></div>
    <div class="day-panel">
      <div class="section-head" style="margin-top:22px"><h2 class="day-title">${esc(cap(fmtLong.format(d)))}</h2><span class="summary" style="margin:0">${items.length?`<b>${openN}</b> açık · ${items.length-openN} tamam`:""}</span></div>
      <form class="add" id="addForm" autocomplete="off">
        <input id="addInput" placeholder="Bu güne iş ekle…" aria-label="Yeni iş" enterkeyhint="done" ${readOnly?"disabled":""}>
        <button type="submit" class="add-btn" ${readOnly?"disabled":""}>${I.plus}<span>Ekle</span></button>
      </form>
      <div class="parse" id="parse" aria-live="polite"></div>
      <div class="section">${items.length?listOf(items):`<div class="empty">Bu gün boş. Yukarıya yazın ya da notlarınıza tarihli bir satır ekleyin.</div>`}</div>
      ${od.length?`<div class="section carry"><div class="section-head"><h2>Önceki günlerden kalan · ${od.length}</h2><button class="link-btn" data-carry="1">Tümünü bugüne taşı</button></div>${listOf(od.map(taskItem),{date:true})}</div>`:""}
      ${monthItems.length?`<div class="section"><div class="section-head"><h2>${esc(cap(fmtMonth.format(m).split(" ")[0]))} ayı içinde</h2></div>${listOf(monthItems)}</div>`:""}
    </div>`;
}
function parseHtml(v){
  if(!v.trim()) return "";
  const p=parseSmart(tidy(v),{scope:"day",date:ui.day,today:new Date()});
  return `<span class="chip where">${esc(whereLabel(p))}</span>${p.time?`<span class="chip">${esc(p.time)}</span>`:""}${p.important?`<span class="chip imp">Önemli</span>`:""}<span class="ex">“${esc(p.text)}”</span>`;
}

/* ---------- geri sayım ---------- */
function renderCountdown(){
  const t=todayStr();
  const items=activeFairs().filter(f=>f.start>=t).map(f=>({text:f.name,date:f.start,fair:f.id}))
    .concat(all().filter(x=>x.scope==="day"&&!x.done&&x.date>=t&&wantsCountdown(x)).map(x=>({text:x.text,date:x.date})))
    .concat(allNoteItems().filter(i=>i.scope==="day"&&!i.done&&i.date>=t&&FAIR.test(i.text)).map(i=>({text:i.text,date:i.date})))
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).slice(0,4);
  document.getElementById("cd").innerHTML=items.map(x=>{const d=daysUntil(x.date);
    return `<button class="cd-card" ${x.fair?`data-cd-fair="${x.fair}"`:`data-cd-day="${x.date}"`}><span class="cd-num${d===0?" today":""}">${d===0?"Bugün":d}</span><span class="cd-txt"><span class="cd-lbl">${d===0?"Başlıyor":"gün kaldı"}</span><span class="cd-name">${esc(x.text)}</span><span class="cd-date">${esc(fmtShort.format(parseYmd(x.date)))}</span></span></button>`}).join("");
}

const $sheet=document.getElementById("sheet"), $scrim=document.getElementById("scrim");
let sheetTimer=null, sheetDraft=null;
function openSheet(id){
  const t=tasks.get(id); if(!t) return;
  sheetId=id; sheetDraft=JSON.parse(JSON.stringify(t)); if(!Array.isArray(sheetDraft.subs)) sheetDraft.subs=[]; if(typeof sheetDraft.desc!=="string") sheetDraft.desc="";
  if(sheetDraft.scope==="someday"||!sheetDraft.date){sheetDraft.scope="day";sheetDraft.date=todayStr();}
  drawSheet(); $sheet.hidden=false;
  requestAnimationFrame(()=>{$sheet.classList.add("show");$scrim.classList.add("show");});
}
function closeSheet(){
  if(!sheetId) return; if(fairDraft){clearTimeout(fairTimer);flushFair();fairDraft=null;} else flushSheet(true); sheetId=null; sheetDraft=null;
  $sheet.classList.remove("show");$scrim.classList.remove("show");
  setTimeout(()=>{if(!sheetId)$sheet.hidden=true},260); render();
}
function scheduleSheetSave(){clearTimeout(sheetTimer);sheetTimer=setTimeout(()=>flushSheet(false),450);}
function flushSheet(final){
  clearTimeout(sheetTimer); if(!sheetDraft||readOnly) return;
  const cur=tasks.get(sheetDraft.id); if(!cur) return;
  const d=JSON.parse(JSON.stringify(sheetDraft));
  d.text=(d.text||"").trim()||cur.text;
  if(final){d.text=tidy(d.text);d.desc=d.desc?d.desc.split("\n").map(l=>l.trim()?tidy(l):l).join("\n"):"";d.subs=d.subs.map(s=>Object.assign(s,{text:tidy(s.text)}));}
  if(JSON.stringify(d)!==JSON.stringify(cur)) put(d);

$sheet.addEventListener("click",e=>{
  if(!sheetDraft) return; const b=e.target.closest("button"); if(!b) return;
  const a=b.dataset.sh;
  if(a==="close"){closeSheet();return;}
  if(readOnly) return;
  if(a==="done"){sheetDraft.done=!sheetDraft.done;sheetDraft.doneAt=sheetDraft.done?Date.now():null;}
  else if(a==="imp") sheetDraft.important=!sheetDraft.important;
  else if(a==="cd") sheetDraft.countdown=!wantsCountdown(sheetDraft);
  else if(a==="notime") sheetDraft.time=null;
  else if(a==="del"){const t=tasks.get(sheetDraft.id);if(t)remove(t);return;}
  else if(b.dataset.shScope){const sc=b.dataset.shScope;if(sc===sheetDraft.scope)return;sheetDraft.scope=sc;
    sheetDraft.date=sc==="day"?ui.day:(sheetDraft.date||ui.day).slice(0,7); if(sc!=="day") sheetDraft.time=null;}
  else if(b.dataset.shQuick!==undefined) sheetDraft.date=ymd(addDays(new Date(),+b.dataset.shQuick));
  else if(b.dataset.shSub){const id=b.closest(".sub").dataset.sub;
    if(b.dataset.shSub==="toggle"){const s=sheetDraft.subs.find(x=>x.id===id);if(s)s.done=!s.done;}
    else sheetDraft.subs=sheetDraft.subs.filter(x=>x.id!==id);}
  else return;
  flushSheet(false); drawSheet();
});

/* ---------- olaylar ---------- */
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]"); if(v&&!e.target.closest("#app")){if(v.dataset.view==="notes"&&ui.view==="notes"){ui.listOpen=true;}ui.view=v.dataset.view;render();window.scrollTo(0,0);return;}
  const cf=e.target.closest("[data-cd-fair]"); if(cf){ui.view="fairs";render();openFair(cf.dataset.cdFair);return;}
  const c=e.target.closest("[data-cd-day]"); if(c){goDay(c.dataset.cdDay);}
});
app.addEventListener("submit",e=>{
  if(e.target.id==="fairForm"){e.preventDefault();const i=document.getElementById("fairInput");if(addFair(i.value)!==false){const n=document.getElementById("fairInput");if(n){n.value="";n.focus();}}return;}
  if(e.target.id!=="addForm")return; e.preventDefault();
  const inp=document.getElementById("addInput"); const v=inp.value; inp.value=""; addTask(v);
  const n=document.getElementById("addInput"); if(n){n.value="";n.focus();document.getElementById("parse").innerHTML="";}
});
app.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="addInput"){const p=document.getElementById("parse");if(p)p.innerHTML=parseHtml(el.value);}
  else if(el.id==="q"){ui.q=el.value;const l=document.getElementById("nlist");if(l)l.innerHTML=nlistHtml();}
  else if(el.id==="ned") saveEditorSoon();
});
app.addEventListener("keyup",e=>{
  if(e.target.id!=="ned") return;
  if(e.key==="Enter"){tidyPrevBlock();saveEditorSoon();}
  updateTableTools();
});
app.addEventListener("paste",e=>{
  if(e.target.closest&&e.target.closest("#ned")){e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData("text/plain");document.execCommand("insertText",false,t);}
});
app.addEventListener("focusout",e=>{
  if(e.target.id!=="ned") return; const ed=e.target; let ch=false;
  ed.querySelectorAll(":scope > div, :scope > p, :scope > h2, li").forEach(b=>{if(b.children.length&&!(b.children.length===1&&b.firstElementChild.tagName==="BR"))return;const t=b.textContent;if(!t.trim())return;const f=tidy(t);if(f!==t){b.textContent=f;ch=true;}});
  if(ch) saveEditorSoon();
  if(noteDirty.has(ed.dataset.note)) flushNote(ed.dataset.note);
});
app.addEventListener("keydown",e=>{
  if(e.target.id!=="ned"||e.key!=="Tab") return;
  const td=curBlock()&&curBlock().closest("td,th"); if(!td) return; e.preventDefault();
  const cells=[...td.closest("table").querySelectorAll("td,th")]; let i=cells.indexOf(td)+(e.shiftKey?-1:1);
  if(i>=cells.length){runTool("row+");return;} if(i>=0) placeCaretIn(cells[i]);
});
app.addEventListener("mousedown",e=>{if(e.target.closest(".ntool"))e.preventDefault();});
document.addEventListener("selectionchange",()=>{if(ui.view==="notes")updateTableTools();});
app.addEventListener("focusin",e=>{if(e.target.id==="ned"){const ed=e.target;if(!ed.firstChild){ed.innerHTML="<div><br></div>";placeCaretIn(ed.firstChild);}}});
app.addEventListener("click",e=>{
  const fig=e.target.closest("#ned figure.sketch"); if(fig&&!readOnly){openDraw(fig.dataset.sketch);return;}
  const cli=e.target.closest("#ned ul.checklist > li");
  if(cli&&!readOnly){const r=cli.getBoundingClientRect();if(e.clientX-r.left<30){cli.dataset.done=cli.dataset.done==="1"?"0":"1";saveEditorSoon();return;}}
  const stg=e.target.closest("[data-stage]"); if(stg){const[fid,k]=stg.dataset.stage.split("|");toggleStage(fid,k);return;}
  const fc=e.target.closest("[data-fair]"); if(fc){openFair(fc.dataset.fair);return;}
  const fi=e.target.closest("[data-fstage]");
  if(fi){const[fid,k]=fi.dataset.fstage.split("|");const bb=e.target.closest("[data-act]");if(bb&&bb.dataset.act==="toggle")toggleStage(fid,k);else if(bb)openFair(fid);return;}
  const b=e.target.closest("button,[data-act]"); if(!b) return;
  if(b.dataset.tool){runTool(b.dataset.tool);return;}
  if(b.dataset.noteList){ui.listOpen=true;render();window.scrollTo(0,0);return;}
  if(b.dataset.noteOpen){openNote(b.dataset.noteOpen);return;}
  if(b.dataset.noteDel){const n=notes.get(b.dataset.noteDel);if(n){clearTimeout(noteTimer);noteDirty.delete(n.id);delNote(n);ui.noteId="draft";render();toast("Sayfa silindi",()=>{putNote(n);openNote(n.id);});}return;}
  if(b.dataset.stat){
    if(b.dataset.stat==="today"||b.dataset.stat==="open"||b.dataset.stat==="done") goDay(todayStr());
    else{const g=document.querySelector(".note-grid");if(g)g.scrollIntoView({behavior:"smooth",block:"start"});}
    return;
  }
  if(b.dataset.step){ui.month=ym(addMonths(parseYm(ui.month),+b.dataset.step));render();return;}
  if(b.dataset.go==="today"){goDay(todayStr());return;}
  if(b.dataset.go==="cal"){ui.view="cal";render();window.scrollTo(0,0);return;}
  if(b.dataset.day){ui.day=b.dataset.day;render();const p=document.querySelector(".day-panel");if(p&&window.innerWidth<=640)p.scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(b.dataset.carry){if(!readOnly){const od=overdue();od.forEach(t=>put(Object.assign({},t,{date:todayStr()}),true));render();toast(od.length+" iş bugüne taşındı");}return;}
  const li=b.closest(".task"); if(!li) return;
  const a=b.dataset.act;
  if(li.dataset.noteLi){openNote(li.dataset.noteLi);return;}
  if(li.dataset.key){
    const key=li.dataset.key;
    if(a==="toggle") toggleNoteItem(key);
    else if(a==="open"){ if(ui.view==="notes"&&ui.noteId===key.split(":")[0]){const it=allNoteItems().find(i=>i.key===key);if(it&&it.scope==="day")goDay(it.date);} else openNote(key.split(":")[0]); }
    return;
  }
  const t=li.dataset.id&&tasks.get(li.dataset.id); if(!t) return;
  if(a==="open"){openSheet(t.id);return;}
  if(readOnly) return;
  if(a==="toggle") toggle(t); else if(a==="next") postpone(t); else if(a==="del") remove(t);
});
app.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("task-body")){e.preventDefault();e.target.click();}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&document.getElementById("drawOv")){closeDraw();return;}
  if(e.key==="Escape"&&sheetId){closeSheet();return;}
});
let lastDay=todayStr();
setInterval(()=>{const t=todayStr();if(t!==lastDay){if(ui.day===lastDay)ui.day=t;lastDay=t;render();}},60000);

render();
connect();
})();
